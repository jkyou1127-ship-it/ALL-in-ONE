<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALL-in-ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Fredoka:wght@600;700&family=Outfit:wght@600;700&display=swap" />
<style>
  :root {
    --bg: #0f1220;
    --bg-soft: #161a2e;
    --card: #1c2140;
    --border: #2a3057;
    --text: #eef0fb;
    --text-dim: #a3a8c9;
    --primary: #5b7cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { width: 100%; max-width: 720px; text-align: center; }
  h1 {
    font-family: "Fredoka", "Do Hyeon", sans-serif;
    font-size: 40px;
    letter-spacing: .02em;
    margin: 0 0 8px;
  }
  .sub { color: var(--text-dim); margin: 0 0 36px; font-size: 15px; }
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }
  a.app-card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 22px;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.app-card:hover { transform: translateY(-3px); border-color: var(--primary); }
  .app-card .icon { font-size: 34px; margin-bottom: 10px; display: block; }
  .app-card strong { display: block; font-size: 19px; margin-bottom: 6px; }
  .app-card span { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  footer { margin-top: 40px; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>ALL-in-ONE</h1>
    <p class="sub">큐브 타이머 · OBD Cube 대회 플랫폼 · C/A License를 한 계정으로 이용하세요</p>
    <div class="apps">
      <a class="app-card" href="timer/">
        <span class="icon">🧊</span>
        <strong>큐브 타이머</strong>
        <span>스크램블, 기록/통계, ao5·ao12, 세션 관리</span>
      </a>
      <a class="app-card" href="obdcube/">
        <span class="icon">🏆</span>
        <strong>OBD Cube</strong>
        <span>온라인 큐브 대회 개최·참가, 순위, 상장/명찰, C/A License 관리</span>
      </a>
    </div>
    <footer>같은 이메일 계정으로 두 앱 모두 로그인됩니다 (통합 로그인).</footer>
  </div>
</body>
</html>
