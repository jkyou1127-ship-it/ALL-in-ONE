name: Deploy ALL-in-ONE to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'index.html'
      - 'timer/**'
      - 'obdcube/public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install timer app dependencies
        working-directory: timer
        run: npm ci

      - name: Build timer app (cube timer)
        working-directory: timer
        run: npm run build

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -r timer/dist site/timer
          cp -r obdcube/public site/obdcube

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
